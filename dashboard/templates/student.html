<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Student Simulation</title>
</head>
<body>
<h1>Student Simulation</h1>
<button id="start">Start Simulation</button>
<div id="identity"></div>
<div id="event_section" style="display:none;">
  <p id="event_text"></p>
  <div id="choices"></div>
</div>
<script>
let student_id = null;
let current_event = null;

document.getElementById("start").onclick = async () => {
  let res = await fetch("/start_student", {method:"POST"});
  let data = await res.json();
  student_id = data.student_id;
  document.getElementById("identity").innerHTML = `<p>${data.identity} (${data.gender})</p><p>${data.blurb}</p>`;
  getNextEvent();
};

async function getNextEvent() {
  let res = await fetch(`/get_next_event/${student_id}`);
  let data = await res.json();
  if(data.done){
    document.getElementById("event_section").innerHTML="<p>Simulation Complete!</p>";
    return;
  }
  current_event = data.event;
  document.getElementById("event_section").style.display="block";
  document.getElementById("event_text").innerText = current_event.event;
  let choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";
  current_event.choices.forEach((c)=>{
    let btn = document.createElement("button");
    btn.innerText=c;
    btn.onclick = ()=>submitMove(c);
    choicesDiv.appendChild(btn);
  });
}

async function submitMove(choice){
  let res = await fetch("/submit_move",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({student_id, choice})
  });
  let data = await res.json();
  alert(`Outcome: ${data.outcome}`);
  getNextEvent();
}
</script>
</body>
</html>
